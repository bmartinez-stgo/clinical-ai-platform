replicaCount: 1

image:
  repository: vllm/vllm-openai
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

app:
  name: vllm-server
  namespace: cap-prod-vllm-server
  modelId: reducto/RolmOCR
  dtype: bfloat16
  maxModelLen: "8192"
  gpuMemoryUtilization: "0.90"
  port: 8000
  hfHome: /var/cache/huggingface
  # enforce-eager avoids a host-memory spike during CUDA graph capture on
  # first load (OOMKilled at the 40Gi pod limit otherwise -- see revert
  # history on the 32B attempt for the same underlying vLLM V1 behavior).
  extraArgs:
    - "--enforce-eager"

gpu:
  enabled: true
  count: 1

resources:
  requests:
    cpu: "2"
    memory: 20Gi
  limits:
    cpu: "6"
    memory: 40Gi

cache:
  mountPath: /var/cache/huggingface
  persistence:
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 30Gi

podLabels: {}
podAnnotations: {}

runtimeClassName: nvidia
nodeSelector:
  workload: large-models
tolerations: []
affinity: {}
