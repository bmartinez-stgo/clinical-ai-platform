replicaCount: 1

image:
  repository: registry:5000/ai-diagnostic
  tag: prod-latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8083
  targetPort: 8083

app:
  name: ai-diagnostic
  namespace: cap-prod-ai-diagnostic
  port: 8083
  logLevel: INFO
  serviceVersion: "0.1.0"
  environment: prod
  vllmReasoningUrl: http://vllm-reasoning.cap-prod-vllm-reasoning.svc.cluster.local:8000
  vllmReasoningModel: Qwen/Qwen2.5-32B-Instruct-AWQ
  vllmTimeoutSeconds: "120"
  maxTokens: "1024"
  temperature: "0.1"
  clinicalRagUrl: http://clinical-rag.cap-prod-clinical-rag.svc.cluster.local:8085
  # Deshabilitado: con el store actual (pocos casos, embedding genérico
  # multilingüe) no hay separación confiable entre coincidencias genuinas y
  # falsas -- un caso verdaderamente similar puede dar menor similitud que
  # uno sin relación (ver research/paper/results/findings_estudio2.md).
  # Subir el umbral no lo resuelve; reactivar requiere repensar el método
  # de recuperación (ej. ponderar por coincidencia de código LOINC, no solo
  # similitud semántica de texto) y/o un store con más volumen.
  clinicalRagEnabled: "false"
  clinicalRagTopK: "3"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

podLabels: {}
podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}

tracing:
  enabled: "true"
  serviceName: ai-diagnostic
  serviceNamespace: cap-prod-ai-diagnostic
  endpoint: http://tempo.observability.svc.cluster.local:4318/v1/traces
